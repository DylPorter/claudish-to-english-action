# Dogfood: this repo's own pull requests get rewritten by the action in the
# working tree (uses: ./), so a regression shows up on the PR that caused it.
#
# Fork PRs get no secrets and a read-only token, so this quietly does nothing
# on them by design. That is also what stops a stranger's PR spending the key.
name: Plain English

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Two pushes in quick succession would otherwise run concurrently, both see no
# existing comment, and both create one. Serialise per pull request.
concurrency:
  group: claudish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rewrite:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          api-base: https://api.deepseek.com/v1
          api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          model: deepseek-chat
