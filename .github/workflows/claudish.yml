# Dogfood: this repo's own pull requests get rewritten by the action in the
# working tree (uses: ./), so a regression shows up on the PR that caused it.
#
# Needs a repository secret holding a key for whichever provider you point at.
name: Plain English

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  rewrite:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          api-key: ${{ secrets.OPENAI_API_KEY }}
