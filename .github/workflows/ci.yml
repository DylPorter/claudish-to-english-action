name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Exercises the committed dist/ bundle against stubbed model and GitHub
      # APIs. Catches bundling and entrypoint breakage that vitest cannot see.
      - run: npm run test:e2e

  # dist/ is committed and executed directly by the runner, so a stale bundle
  # ships broken code while every test still passes. This catches that.
  bundle-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fail if dist/ differs from a fresh build
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat dist/
            exit 1
          fi
